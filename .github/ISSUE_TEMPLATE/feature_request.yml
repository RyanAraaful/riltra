name: Feature request
description: Suggest a capability or improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Describe the goal and use case. Do not include credentials, private
        source code, or identifying local paths.
  - type: textarea
    id: goal
    attributes:
      label: Goal and use case
      description: What are you trying to accomplish, and who needs this?
    validations:
      required: true
  - type: textarea
    id: current_workaround
    attributes:
      label: Current workaround
      description: How do you handle this today? If there is no workaround, say so.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome you want. Implementation details are optional.
    validations:
      required: true
