name: ci

on:
  push:
  pull_request:

# A superseded pull-request run is cancelled. Every other run gets a group of
# its own: with the default queue a newer pending run cancels an older pending
# one, which would drop the CI result of a master commit.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The `name` of each entry is the JOB NAME, and the job names are the
        # required status-check contexts of the `protect-master` ruleset
        # ("check (windows-latest)", "check (ubuntu-latest)", "check
        # (macos-15)"). They must not change: a renamed context is never
        # reported, so every pull request to master would stay blocked.
        #
        # What changed is the RUNNER. `macos-15` is the macOS 15 ARM64
        # image, and so was `macos-latest` before it, so the earlier pin
        # (4c47625) moved from one ARM64 label to another and kept the same
        # capacity constraint. A job that cannot be given a runner is
        # cancelled after GitHub's acquisition retries ("The job was not
        # acquired by Runner of type hosted even after multiple attempts"),
        # which leaves the required context missing. `macos-15-intel` is the
        # same macOS 15 release on the separate x64 pool.
        #
        # macOS ARM64 is therefore no longer covered by this matrix. Restore
        # it as a SEPARATE, NON-REQUIRED workflow once the ARM64 pool
        # recovers; a `continue-on-error` matrix entry would report a
        # cancelled job as a pass, which is not acceptable evidence.
        include:
          - { name: windows-latest, runner: windows-latest }
          - { name: ubuntu-latest, runner: ubuntu-latest }
          - { name: macos-15, runner: macos-15-intel }
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Timeouts are 3x the longest of the last 10 successful runs, rounded up to
    # 5 minutes (here macos-15: 499 s). Without one a job may run for GitHub's
    # 6 h default: run 41669633876 held a macos-15 job until that limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cargo's offline dependency audit can need package sources for
      # platform-specific lockfile entries. Provision them here; this is CI
      # build tooling only, and Riltra core remains network-free at runtime.
      - name: Fetch locked sources for dependency audit
        run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo check --locked
      - name: Test core suite and offline dependency audit
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked
      - run: cargo run -q -p riltra -- --help
      - run: cargo run -q -p riltra -- --version
      - run: cargo run -q -p riltra -- status

  # Source-build preflight for the default-off semantic-knowledge graph.
  # This does not provision or download the model or ONNX Runtime assets;
  # native local inference with verified assets is a later integration gate.
  semantic-knowledge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-latest, runner: windows-latest }
          - { name: ubuntu-latest, runner: ubuntu-latest }
          - { name: macos-15, runner: macos-15-intel }
    name: semantic-knowledge (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked sources for offline optional dependency audit
        run: cargo fetch --locked
      - name: Install pinned protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'protoc-33.5.zip'
          $root = Join-Path $env:RUNNER_TEMP 'protoc-33.5'
          Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v33.5/protoc-33.5-win64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne '7e3468cd1fbd1ae9361a5304d4ac28fbd593aa1a425b5464bd9d4da5fca224b4') { throw "protoc archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $root 'bin')
          $version = & (Join-Path $root 'bin/protoc.exe') --version
          if ($version -ne 'libprotoc 33.5') { throw "unexpected protoc version: $version" }
      - name: Install pinned protoc (Linux and macOS Intel)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=protoc-33.5-linux-x86_64.zip
              expected=24e58fb231d50306ee28491f33a170301e99540f7e29ca461e0e80fd1239f8d1 ;;
            macOS)
              asset=protoc-33.5-osx-x86_64.zip
              expected=7f31625f8bec4929082ae9209e101c1c03692624457cc6332f83736db495ee92 ;;
            *) echo "unsupported protoc runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v33.5/$asset" -o "$archive"
          if [[ "$RUNNER_OS" == macOS ]]; then
            actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          else
            actual="$(sha256sum "$archive" | awk '{print $1}')"
          fi
          [[ "$actual" == "$expected" ]] || { echo "protoc archive SHA-256 mismatch: $actual" >&2; exit 1; }
          root="$RUNNER_TEMP/protoc-33.5"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
          [[ "$("$root/bin/protoc" --version)" == 'libprotoc 33.5' ]]
      - name: Check all optional-feature targets
        run: cargo check --locked --no-default-features --features semantic-knowledge --all-targets
      - name: Test local asset validation and embedding contract
        run: cargo test --locked --no-default-features --features semantic-knowledge --bin riltra inference::tests
      - name: Test deterministic MCP JSON with optional feature graph
        run: cargo test --locked --no-default-features --features semantic-knowledge --bin riltra mcp_structured_json_is_recursively_sorted_for_core_byte_compatibility
      - name: Test deterministic MCP tool schemas with optional feature graph
        run: cargo test --locked --no-default-features --features semantic-knowledge --bin riltra tool_schemas_keep_core_key_order
      - name: Test advertised MCP schema order with optional feature graph
        run: cargo test --locked --no-default-features --features semantic-knowledge --test mcp mcp_tools_list_advertises_the_fourteen_tools
      - name: Test core and optional dependency audits offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --no-default-features --features semantic-knowledge --test semantic new_

  # Phase A of M10 Task 5: a native archive from this commit, installed and
  # checked on each native x64 runner. It complements the `check` matrix and
  # does not replace release-candidate.yml or create a release. The job names
  # are deliberately new: the required `check (...)` contexts stay unchanged.
  installer-phase-a:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-2025, runner: windows-2025, platform: windows-x64, ext: zip }
          - { name: ubuntu-24.04, runner: ubuntu-24.04, platform: linux-x64, ext: tar.gz }
          - { name: macos-15-intel, runner: macos-15-intel, platform: macos-x64, ext: tar.gz }
    name: installer (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Same rule as `check`: macos-15-intel took at most 732 s.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked sources for complete SBOM and notices
        run: cargo fetch --locked
      - name: Release build
        run: cargo build --release --locked -p riltra
      - name: Release documents match the locked dependency graph
        run: cargo run --locked -q --example release_docs -- --check
      - name: Package
        shell: bash
        run: bash release/package.sh "${{ matrix.platform }}" "${{ matrix.ext }}"
      - name: Installer Phase A (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem -LiteralPath dist -Filter *.zip | Select-Object -First 1).FullName
          pwsh -NoProfile -File release/test-install.ps1 -ArchivePath $archive
      - name: Installer Phase A (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive=
          for candidate in dist/riltra-*.tar.gz; do archive=$candidate; break; done
          bash release/test-install.sh --archive "$archive"

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies against RustSec
        run: cargo audit --file Cargo.lock

  security:
    runs-on: ubuntu-latest
    # Same rule as `check`: at most 30 s.
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_BIN: ${{ github.workspace }}/bin/gitleaks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks 8.30.1
        run: |
          mkdir -p "$PWD/bin"
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$PWD/bin" gitleaks
      - name: Scan changed commits
        if: github.event_name == 'pull_request'
        run: security/scan.sh range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
      - name: Scan pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: security/scan.sh range "${{ github.event.before }}..${{ github.sha }}"
      - name: Scan new branch commits
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          security/scan.sh new-branch "$DEFAULT_BRANCH"
      - name: Scan committed tree
        run: security/scan.sh tree
      - name: Scanner regression tests
        run: bash security/scan-tests.sh
