[package]
name = "riltra"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local code map and project notebook for developers and AI coding agents: CLI and MCP server"

[dependencies]
protobuf = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
rusqlite = { version = "0.40", features = ["bundled"] }
petgraph = { version = "=0.8.3", default-features = false }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "macros"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
fastembed = { version = "=7.6.0", default-features = false, features = ["ort-load-dynamic"], optional = true }
lancedb = { version = "=0.41.0", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-24", "load-dynamic"], optional = true }
sha2 = { version = "0.10", optional = true }
tokenizers = { version = "=0.23.2", default-features = false, optional = true }

[features]
default = []
semantic-knowledge = ["dep:fastembed", "dep:lancedb", "dep:ort", "dep:sha2", "dep:tokenizers"]

[[bin]]
name = "riltra"
path = "src/main.rs"
